name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Sync dev dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Run tests
        run: uv run pytest
