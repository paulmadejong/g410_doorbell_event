[project]
name = "g410-doorbell-event"
version = "0.1.0"
description = "Home Assistant custom integration for Aqara G410 ring events over Matter."
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "/tmp/pytest-g410-doorbell-event"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
